<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blackhook Group</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Michroma&family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --black: #000000;
            --black-soft: #0D0D0E;
            --silver-bright: #F1F2F4;
            --silver: #ADB2B9;
            --silver-dim: #55585E;
            --white: #FAFAFA;
        }
        body {
            font-family: 'Barlow', 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.7;
            margin: 0;
            padding: 0;
            color: var(--white);
            background: var(--black);
            min-height: 100vh;
        }
        .container {
            max-width: 650px;
            margin: 0 auto;
            padding: 4rem 1.5rem;
        }
        header {
            text-align: center;
            margin-bottom: 4rem;
        }
        .logo-img {
            max-width: 420px;
            width: 100%;
            height: auto;
            margin-bottom: 1.5rem;
        }
        h1 {
            font-family: 'Barlow Semi Condensed', sans-serif;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin: 0;
            font-weight: 500;
            color: var(--silver);
        }
        h2 {
            font-family: 'Michroma', sans-serif;
            font-size: 1.05rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 400;
            color: var(--silver-bright);
            margin-top: 3.5rem;
        }
        p {
            font-size: 1.05rem;
            margin-top: 0.5rem;
            color: var(--silver);
        }
        section {
            text-align: center;
        }
        .transmit {
            font-family: 'Courier New', monospace;
            font-size: 1rem;
            color: var(--silver-bright);
            letter-spacing: 0.5px;
        }
        .transmit a {
            color: var(--silver-bright);
            text-decoration: none;
            border-bottom: 1px solid var(--silver-dim);
        }
        .transmit a:hover {
            border-bottom-color: var(--silver-bright);
        }
        footer {
            text-align: center;
            margin-top: 6rem;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--silver-dim);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <img src="logo.jpg" alt="Blackhook Group Logo" class="logo-img">
        </header>

        <section>
            <h2>Contact</h2>
            <p class="transmit">// TRANSMIT TO: <a href="mailto:hello@blackhookgroup.com">hello@blackhookgroup.com</a></p>
        </section>

        <footer>
            <p>&copy; 2026 Blackhook Group. All rights reserved.</p>
        </footer>
    </div>

</body>
</html>
