<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blackhook Group</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Michroma&family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --black: #000000;
            --black-soft: #0D0D0E;
            --silver-bright: #F1F2F4;
            --silver: #ADB2B9;
            --silver-dim: #55585E;
            --white: #FAFAFA;
            --zinc: #71717A;
        }
        body {
            font-family: 'Barlow', 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.7;
            margin: 0;
            padding: 0;
            color: var(--white);
            background: var(--black);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .hero {
            text-align: center;
            padding: 3rem 1.5rem;
            max-width: 650px;
        }
        .logo-img {
            max-width: 420px;
            width: 100%;
            height: auto;
            margin-bottom: 3rem;
            opacity: 1;
        }
        .lockup {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.6rem;
        }
        .transmit {
            font-family: 'Courier New', monospace;
            font-size: 1rem;
            letter-spacing: 0.5px;
            margin: 64px 0 0;
        }
        .transmit .prefix {
            color: #52525B;
        }
        .transmit a {
            color: #E2E8F0;
            text-decoration: none;
            transition: color 0.2s ease;
        }
        .transmit a:hover {
            color: #FFFFFF;
        }
        .telemetry {
            position: fixed;
            font-family: ui-monospace, 'SF Mono', 'JetBrains Mono', monospace;
            font-size: 11px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #71717A;
            opacity: 0.75;
            margin: 0;
            transition: opacity 0.2s ease;
        }
        .telemetry:hover {
            opacity: 1;
            color: #A1A1AA;
        }
        #status-corner {
            top: 32px;
            left: 32px;
        }
        #copyright-corner {
            bottom: 32px;
            left: 32px;
        }
        #time-corner {
            bottom: 32px;
            right: 32px;
        }
        .hud-top-right {
            position: fixed;
            top: 32px;
            right: 32px;
            color: #52525B;
            font-family: 'SF Mono', 'JetBrains Mono', ui-monospace, monospace;
            font-size: 11px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            user-select: none;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="hero">
        <img src="logo.jpg" alt="Blackhook Group Logo" class="logo-img">
        <div class="lockup">
            <p class="transmit"><span class="prefix">// TRANSMIT TO: </span><a href="mailto:hello@blackhookgroup.com">hello@blackhookgroup.com</a></p>
        </div>
    </div>

    <p class="telemetry" id="status-corner">// SYSTEM STATUS: OPERATIONAL</p>

    <p class="telemetry" id="copyright-corner">&copy; Blackhook Group.</p>

    <p class="telemetry" id="time-corner">// SYS.TIME: <span id="sys-time"></span></p>

    <div class="hud-top-right">// BURN RATE: ZERO</div>

    <script>
        function updateSysTime() {
            var el = document.getElementById('sys-time');
            if (el) el.textContent = new Date().toISOString().replace(/\.\d{3}Z$/, 'Z');
        }
        updateSysTime();
        setInterval(updateSysTime, 1000);
    </script>
</body>
</html>
