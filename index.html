<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blackhook Group</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Michroma&family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --black: #000000;
            --black-soft: #0D0D0E;
            --silver-bright: #F1F2F4;
            --silver: #ADB2B9;
            --silver-dim: #55585E;
            --white: #FAFAFA;
        }
        body {
            font-family: 'Barlow', 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.7;
            margin: 0;
            padding: 0;
            color: var(--white);
            background: var(--black);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .hero {
            text-align: center;
            padding: 3rem 1.5rem;
            max-width: 650px;
        }
        .logo-img {
            max-width: 420px;
            width: 100%;
            height: auto;
            margin-bottom: 3rem;
        }
        .lockup {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.6rem;
        }
        .status-line {
            font-family: 'Courier New', monospace;
            font-size: 0.75rem;
            letter-spacing: 0.5px;
            color: #71717A;
            margin: 0;
        }
        h2 {
            font-family: 'Michroma', sans-serif;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 400;
            color: var(--silver-bright);
            margin: 0;
        }
        .transmit {
            font-family: 'Courier New', monospace;
            font-size: 1rem;
            color: var(--silver-bright);
            letter-spacing: 0.5px;
            margin: 0;
        }
        .transmit a {
            color: var(--silver-bright);
            text-decoration: none;
            border-bottom: 1px solid var(--silver-dim);
        }
        .transmit a:hover {
            border-bottom-color: var(--silver-bright);
        }
        .meta {
            position: fixed;
            left: 1.25rem;
            bottom: 1rem;
            text-align: left;
            font-size: 0.6rem;
            letter-spacing: 0.5px;
            color: var(--silver-dim);
        }
        .meta p {
            margin: 0;
        }
    </style>
</head>
<body>

    <div class="hero">
        <img src="logo.jpg" alt="Blackhook Group Logo" class="logo-img">
        <div class="lockup">
            <p class="status-line">// SYSTEM STATUS: OPERATIONAL</p>
            <h2>Contact</h2>
            <p class="transmit">// TRANSMIT TO: <a href="mailto:hello@blackhookgroup.com">hello@blackhookgroup.com</a></p>
        </div>
    </div>

    <div class="meta">
        <p>&copy; Blackhook Group.</p>
        <p>// SYS.TIME: <span id="sys-time"></span></p>
    </div>

    <script>
        function updateSysTime() {
            var el = document.getElementById('sys-time');
            if (el) el.textContent = new Date().toISOString().replace(/\.\d{3}Z$/, 'Z');
        }
        updateSysTime();
        setInterval(updateSysTime, 1000);
    </script>
</body>
</html>
