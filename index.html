<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blackhook Group</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Michroma&family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --black: #000000;
            --black-soft: #0D0D0E;
            --silver-bright: #F1F2F4;
            --silver: #ADB2B9;
            --silver-dim: #55585E;
            --white: #FAFAFA;
            --zinc: #71717A;
        }
        body {
            font-family: 'Barlow', 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.7;
            margin: 0;
            padding: 0;
            color: var(--white);
            background: var(--black);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .hero {
            text-align: center;
            padding: 3rem 1.5rem;
            max-width: 650px;
        }
        .logo-img {
            max-width: 420px;
            width: 100%;
            height: auto;
            margin-bottom: 3rem;
            opacity: 1;
        }
        .lockup {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.6rem;
        }
        h2 {
            font-family: 'Michroma', sans-serif;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 400;
            color: var(--zinc);
            opacity: 0.4;
            margin: 0;
        }
        .transmit {
            font-family: 'Courier New', monospace;
            font-size: 1rem;
            letter-spacing: 0.5px;
            margin: 0;
        }
        .transmit .prefix {
            color: var(--zinc);
            opacity: 0.4;
        }
        .transmit a {
            color: var(--white);
            opacity: 0.78;
            text-decoration: none;
            border-bottom: 1px solid var(--silver-dim);
        }
        .transmit a:hover {
            opacity: 1;
            border-bottom-color: var(--silver-bright);
        }
        .telemetry {
            position: fixed;
            font-family: 'Courier New', monospace;
            font-size: 0.7rem;
            letter-spacing: 0.5px;
            color: var(--zinc);
            opacity: 0.4;
            margin: 0;
        }
        .telemetry:hover {
            opacity: 0.8;
        }
        #status-corner {
            top: 24px;
            left: 24px;
        }
        #time-corner {
            bottom: 24px;
            right: 24px;
            text-align: right;
        }
        #time-corner p {
            margin: 0;
        }
    </style>
</head>
<body>

    <div class="hero">
        <img src="logo.jpg" alt="Blackhook Group Logo" class="logo-img">
        <div class="lockup">
            <h2>Contact</h2>
            <p class="transmit"><span class="prefix">// TRANSMIT TO: </span><a href="mailto:hello@blackhookgroup.com">hello@blackhookgroup.com</a></p>
        </div>
    </div>

    <p class="telemetry" id="status-corner">// SYSTEM STATUS: OPERATIONAL</p>

    <div class="telemetry" id="time-corner">
        <p>&copy; Blackhook Group.</p>
        <p>// SYS.TIME: <span id="sys-time"></span></p>
    </div>

    <script>
        function updateSysTime() {
            var el = document.getElementById('sys-time');
            if (el) el.textContent = new Date().toISOString().replace(/\.\d{3}Z$/, 'Z');
        }
        updateSysTime();
        setInterval(updateSysTime, 1000);
    </script>
</body>
</html>
